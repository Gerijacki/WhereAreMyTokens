name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a normal multi-arch build takes ~7 min; fail fast if emulation hangs
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          labels: |
            org.opencontainers.image.title=WhereAreMyTokens
            org.opencontainers.image.description=Self-hosted analytics for Claude Code subscriptions
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from the changelog
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${REPO,,}:${version}"
          {
            awk -v v="$version" '/^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md \
              | sed -E "s#\]\((docs|deploy)/#](https://github.com/${REPO}/blob/main/\1/#g"
            printf '\n## Install\n\n```bash\ndocker pull %s\ndocker run --rm -p 8788:8787 %s demo   # try it on demo data\n```\n' "$image" "$image"
            printf '\nSetup, configuration and the homelab guide are in the [README](https://github.com/%s#readme).\n' "$REPO"
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: notes.md
