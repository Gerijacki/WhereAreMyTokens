name: Bug report
description: Something is wrong or numbers don't add up
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Please don't paste real transcripts, prompts or tokens.** If a transcript line is needed, replace the text with placeholders first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. docker compose up\n2. open Insights\n3. ..."
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or a commit SHA
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options: [Docker Compose, Local (wamt serve), Agent on another machine, Other]
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Shown by `claude --version`. Transcript formats change between versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
