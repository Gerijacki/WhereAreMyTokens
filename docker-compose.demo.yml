# Try WhereAreMyTokens with synthetic data - nothing from your machine is read.
#   docker compose -f docker-compose.demo.yml up --build
# then open http://localhost:8788. Without cloning the repo:
#   docker run --rm -p 8788:8787 ghcr.io/gerijacki/wherearemytokens demo
services:
  demo:
    build: .
    ports:
      - "${WAMT_DEMO_PORT:-8788}:8787"
    command: ["demo"]
