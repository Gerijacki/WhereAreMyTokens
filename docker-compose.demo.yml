# Try WhereAreMyTokens with synthetic data - nothing from your machine is read.
#   docker compose -f docker-compose.demo.yml up --build
# then open http://localhost:8788
services:
  demo:
    build: .
    ports:
      - "${WAMT_DEMO_PORT:-8788}:8787"
    environment:
      WAMT_DATABASE_URL: sqlite:////tmp/wamt-demo.db
      WAMT_CLAUDE_DATA_DIR: /tmp/demo-data
      WAMT_SOURCE_NAME: demo
    command: ["sh", "-c", "wamt demo --dir /tmp/demo-data && exec wamt serve --host 0.0.0.0 --port 8787"]
